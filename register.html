<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="css/all.css" />
        <link rel="stylesheet" href="css/style.css" />

        <style>
            .toggle-password {
                position: absolute;
                right: 10px;
                top: 38px;
                cursor: pointer;
                font-size: 18px;
            }
        </style>
    </head>

    <body>
        <header class="main-header">
            <div class="container">
                <div class="header-wrap">
                    <a href="index.html" class="logo">
                        <span>MyStore</span>
                    </a>

                    <h6 id="user" class="user-name"></h6>

                    <nav class="header-nav">
                        <ul id="links" class="auth-links">
                            <li><a href="login.html">Sign In</a></li>
                            <li>
                                <a href="register.html" class="btn-signup"
                                    >Sign Up</a
                                >
                            </li>
                        </ul>

                        <ul id="userInfo" class="user-actions">
                            <li class="shoppingCart">
                                <i class="fas fa-shopping-cart"></i>
                                <span class="badge"></span>

                                <div class="cartsProudect">
                                    <div class="buyProudect"></div>

                                    <div class="total">
                                        <span>Total</span>
                                        <strong class="totalPrice"></strong>
                                    </div>

                                    <a
                                        href="cartProudcts.html"
                                        class="view-cart"
                                    >
                                        View Cart
                                    </a>
                                </div>
                            </li>

                            <li>
                                <a
                                    href="index.html"
                                    id="logOut"
                                    onclick="logOut()"
                                >
                                    Logout
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <section
            class="d-flex justify-content-center align-items-center bg-primary"
            style="min-height: calc(100vh - 70px)"
        >
            <div class="bg-white p-4 rounded shadow" style="width: 340px">
                <h3 class="text-center mb-4">Register</h3>

                <form id="registerForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input
                            type="text"
                            id="userName"
                            class="form-control"
                            placeholder="Enter username"
                        />
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter email"
                        />
                    </div>

                    <div class="form-group position-relative">
                        <label>Password</label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter password"
                        />
                    </div>

                    <p id="errorMsg" class="text-danger text-center d-none">
                        All fields are required
                    </p>

                    <button
                        id="register"
                        type="submit"
                        class="btn btn-primary btn-block"
                    >
                        Sign Up
                    </button>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </form>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/register.js"></script>
        <script src="js/user.js"></script>
    </body>
</html>
